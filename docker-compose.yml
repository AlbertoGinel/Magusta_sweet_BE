version: '3.8'

services:
  app:
    build:
      context: . # this should be the directory with your Dockerfile for the Java Spring app
    ports:
      - "8080:8080" # map app port to local
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/magustadatabase
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:13
    environment:
      POSTGRES_DB: magustadatabase
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432" # map Postgres port to local (optional)
    volumes:
      - postgres_data:/var/lib/postgresql/data # persistent storage
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "80:80"
    depends_on:
      - db
    restart: unless-stopped

networks:
  default:
    name: mynetwork
    external: true

volumes:
  postgres_data: